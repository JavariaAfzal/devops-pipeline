services:
  app:
    build: .
    container_name: devops-pipeline-app-compose
    expose:
      - "5000"
    environment:
      APP_MESSAGE: "DevOps Pipeline Application is Running!"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: devops-pipeline-nginx
    ports:
      - "5002:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app