services:
  app:
    build: .
    container_name: devops-pipeline-app-compose
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    container_name: devops-pipeline-nginx
    ports:
      - "5002:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app